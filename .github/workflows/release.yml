name: Release for tags
on:
  push:
  pull_request:
  create:
    tags:
      - v*
permissions:
  contents: write
# The Linux build job was removed so a tag only has to wait for the Windows build before the
# release is published - create-release used to depend on both, so a slow or failing Linux build
# held up the Windows download. `npm run package-linux` still exists for building it by hand; see
# this file's git history for the job definition if it should come back.
jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: pwsh
        run: echo "dir=$(npm config get cache)" >> ${env:GITHUB_OUTPUT}
      - uses: actions/cache@v3
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: NPM install
        run: npm install --dev
      - name: Build Electron
        run: npm run package-windows
      - name: Upload electron-windows
        uses: actions/upload-artifact@v4
        with:
          path: dist/win-unpacked
          name: teslaterm-windows
  create-release:
    name: Create release if required
    runs-on: ubuntu-latest
    needs: [build-windows]
    env:
      release: ${{ github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v')}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # This repo doesn't merge via PRs, so GitHub's own generate_release_notes (which is PR-based)
      # produced release bodies that were essentially just the "Full Changelog" compare link with
      # nothing above it - not useful. Building the changelog directly from git log between the
      # previous tag and this one instead gives an actual list of what changed.
      - name: Generate changelog
        if: env.release == 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          echo "## Changes" > changelog.md
          echo "" >> changelog.md
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" "$PREV_TAG..$GITHUB_REF_NAME" >> changelog.md
          else
            git log --pretty=format:"- %s" "$GITHUB_REF_NAME" >> changelog.md
          fi
      - name: Download teslaterm-windows
        uses: actions/download-artifact@v4
        with:
          name: teslaterm-windows
          path: windows
      - name: Re-zip Windows artifact
        working-directory: windows
        run: zip -r ../teslaterm-windows.zip *
      - name: Create and upload release builds
        uses: softprops/action-gh-release@v1
        if: env.release == 'true'
        with:
          body_path: changelog.md
          files: |
            teslaterm-windows.zip
